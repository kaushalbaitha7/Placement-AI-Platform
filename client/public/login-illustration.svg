<svg width="700" height="520" viewBox="0 0 700 520" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="700" y2="520">
<stop offset="0%" stop-color="#4F8EF7"/>
<stop offset="100%" stop-color="#2563EB"/>
</linearGradient>

<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#EEF5FF"/>
</linearGradient>

<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1D4ED8" flood-opacity=".18"/>
</filter>

</defs>

<!-- Background Blob -->

<ellipse cx="350" cy="260" rx="300" ry="210" fill="url(#bg)" opacity=".12"/>

<!-- Laptop -->

<rect x="150" y="150" width="360" height="220" rx="18" fill="url(#card)" filter="url(#shadow)"/>

<rect x="175" y="175" width="310" height="170" rx="12" fill="#F8FAFC"/>

<rect x="120" y="370" width="420" height="22" rx="11" fill="#CBD5E1"/>

